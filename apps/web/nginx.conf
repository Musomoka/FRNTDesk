# nginx-unprivileged listens on 8080 by default; kept explicit here since
# that default is what apps/web/Dockerfile's EXPOSE and Bunny's container
# port setting both have to agree on.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular client-side routing: unknown paths fall back to index.html
    # rather than a static 404, so deep links (e.g. /catalog) work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
