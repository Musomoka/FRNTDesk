# nginx-unprivileged listens on 8080 by default; kept explicit here since
# that default is what apps/web/Dockerfile's EXPOSE and Bunny's container
# port setting both have to agree on.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The api container runs alongside this one in the same Bunny
    # Application, sharing a network namespace — same localhost:3000 target
    # apps/web/proxy.conf.json uses for local dev.
    location /api {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular client-side routing: unknown paths fall back to index.html
    # rather than a static 404, so deep links (e.g. /catalog) work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
